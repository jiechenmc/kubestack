# template for kubernetes/manifests/secrets.yaml (git-ignored, applied by hand with kubectl apply).
# these are the only secrets not in git or infisical: the infisical machine identity that every
# InfisicalSecret authenticates with, and the pgadmin login.
apiVersion: v1
kind: Secret
metadata: { name: infisical-universal-auth, namespace: default }
stringData:
  clientId: <>
  clientSecret: <>
---
# pgadmin4 login password, see pgadmin.yaml
apiVersion: v1
kind: Secret
metadata: { name: pgadmin, namespace: pgadmin }
stringData:
  password: <>
