# template for kubernetes/manifests/secrets.yaml (git-ignored, applied by hand with kubectl apply).
# the one secret that can't come from infisical: the machine identity every InfisicalSecret
# authenticates with. everything else is an InfisicalSecret in git.
apiVersion: v1
kind: Secret
metadata: { name: infisical-universal-auth, namespace: default }
stringData:
  clientId: <>
  clientSecret: <>
