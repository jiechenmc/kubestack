# hyperdx ingestion key for the collector's otlphttp/clickstack exporter (infisical: HYPERDX_INGESTION_KEY,
# copied from hyperdx team settings). until it exists the exporter sends no key and clickstack rejects
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: hyperdx-ingestion
  namespace: logging
spec:
  syncConfig:
    resyncInterval: 60s
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: default
      secretsScope:
        projectSlug: kubestack-ke-j0
        envSlug: prod # "Production"
        secretsPath: "/"
  managedKubeSecretReferences:
    - secretName: hyperdx-ingestion
      secretNamespace: logging
      creationPolicy: Orphan
      template:
        includeAllSecrets: false
        data:
          HYPERDX_INGESTION_KEY: "{{ .HYPERDX_INGESTION_KEY.Value }}"
