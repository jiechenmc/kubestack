# clickstack namespace: pods only take traffic from each other (operators, clickhouse, keeper,
# mongodb, hyperdx, its collector), plus the two entry points below. the clickhouse and mongodb
# passwords sit in git (helm/clickstack/values-kubestack.yaml), so this is what keeps them useless
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: same-namespace-only
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# otlp in from the otel-logs agents (logging) and the gateway collector (tracing); own metrics for
# prometheus (monitoring)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [logging, tracing]
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8888
---
# the ui through traefik (default namespace)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hyperdx-ui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clickstack
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
