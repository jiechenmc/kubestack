# golden vm disks (DataVolumes uploaded with virtctl image-upload, e.g. packer/rocky10); vms in any
# namespace clone their root disk from here
apiVersion: v1
kind: Namespace
metadata:
  name: vm-images
---
# cdi clones a golden disk into another namespace only if that namespace's default service account
# may use it as a DataVolume source. vms (kubernetes/manifests/vms.yaml) clones its root disks from here
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: datavolume-source
  namespace: vm-images
rules:
  - apiGroups: [cdi.kubevirt.io]
    resources: [datavolumes/source]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: datavolume-source-vms
  namespace: vm-images
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: datavolume-source
subjects:
  - kind: ServiceAccount
    name: default
    namespace: vms
