# the KubeVirt cr: virt-operator deploys virt-api, virt-controller and the virt-handler daemonset from it.
# the crd comes from kubevirt-operator.yaml in the same app, so this applies one wave later
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      featureGates: []
    imagePullPolicy: IfNotPresent
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
  # virt-operator creates its ServiceMonitor and PrometheusRules (vm/handler alerts) here and grants this
  # service account read access to virt-handler metrics; kube-prometheus-stack selects every monitor/rule
  monitorNamespace: monitoring
  monitorAccount: kube-prometheus-stack-prometheus
  workloadUpdateStrategy: {}
