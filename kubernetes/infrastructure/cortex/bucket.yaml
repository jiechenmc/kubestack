# rook creates the bucket plus a cortex-bucket Secret/ConfigMap with its s3 credentials and endpoint.
# the bucket storage class reclaims with Delete, so argo must never delete this claim
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: cortex-bucket
  namespace: cortex
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  bucketName: cortex
  storageClassName: rook-ceph-bucket
