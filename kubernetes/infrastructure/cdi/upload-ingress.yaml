# cdi upload proxy at cdi-upload.home.arpa, for virtctl image-upload (the CDI cr points
# uploadProxyURLOverride here). the proxy only speaks https, with a cert from cdi's own rotating ca
# (published as ca-bundle.crt, a key traefik can't read), so traefik skips verification on this one
# in-cluster hop. the operator owns the cdi-uploadproxy service, so the traefik annotations go on a
# second service selecting the same pods
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: cdi-uploadproxy
  namespace: cdi
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  insecureSkipVerify: true
---
apiVersion: v1
kind: Service
metadata:
  name: cdi-uploadproxy-ingress
  namespace: cdi
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: cdi-cdi-uploadproxy@kubernetescrd
spec:
  selector:
    cdi.kubevirt.io: cdi-uploadproxy
  ports:
    - name: https
      port: 443
      targetPort: 8443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cdi-uploadproxy
  namespace: cdi
spec:
  ingressClassName: traefik
  rules:
    - host: cdi-upload.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cdi-uploadproxy-ingress
                port:
                  name: https
