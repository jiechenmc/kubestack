# clickstack: hyperdx ui (hyperdx.home.arpa), clickhouse, mongodb, its otlp collector; side by side
# with loki/tempo, fed a copy of logs and traces by the existing collectors
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickstack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  sources:
    - repoURL: https://github.com/jiechenmc/kubestack.git
      targetRevision: main
      path: kubernetes/helm/clickstack
      helm:
        releaseName: clickstack
        valueFiles:
          - values-kubestack.yaml
    - repoURL: https://github.com/jiechenmc/kubestack.git
      targetRevision: main
      path: kubernetes/infrastructure/clickstack
  destination:
    server: https://kubernetes.default.svc
    namespace: clickstack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true # clickhouse/mongodb crds come from clickstack-operators
    retry:
      limit: 10
      backoff:
        duration: 10s
        maxDuration: 5m
