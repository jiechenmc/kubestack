# clickhouse and mongodb operators (and their crds) for clickstack
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickstack-operators
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://github.com/jiechenmc/kubestack.git
      targetRevision: main
      path: kubernetes/helm/clickstack-operators
      helm:
        releaseName: clickstack-operators
  destination:
    server: https://kubernetes.default.svc
    namespace: clickstack
  syncPolicy:
    automated:
      prune: false  # chart owns crds; deleting one deletes every resource of that kind
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        maxDuration: 5m
