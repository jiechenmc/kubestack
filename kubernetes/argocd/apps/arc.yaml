# actions-runner-controller for the self-hosted github runners
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://github.com/jiechenmc/kubestack.git
      targetRevision: main
      path: kubernetes/helm/gha-runner-scale-set-controller
      helm:
        releaseName: arc
        valueFiles:
          - values-kubestack.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  syncPolicy:
    automated:
      prune: false  # operator chart owns its crds; deleting one deletes every resource of that kind
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        maxDuration: 5m
