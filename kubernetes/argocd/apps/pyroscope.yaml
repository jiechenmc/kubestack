# pyroscope: continuous profiling (profiles in a ceph rgw bucket, kubernetes/infrastructure/profiling)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pyroscope
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://github.com/jiechenmc/kubestack.git
      targetRevision: main
      path: kubernetes/helm/pyroscope
      helm:
        releaseName: pyroscope
        valueFiles:
          - values-kubestack.yaml
    - repoURL: https://github.com/jiechenmc/kubestack.git
      targetRevision: main
      path: kubernetes/infrastructure/profiling
  destination:
    server: https://kubernetes.default.svc
    namespace: profiling
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        maxDuration: 5m
