# runner scale set: jiechenmc/plantain unity builds
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plantain-build
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://github.com/jiechenmc/kubestack.git
      targetRevision: main
      path: kubernetes/helm/gha-runner-scale-set
      helm:
        releaseName: plantain-build
        valueFiles:
          - values-kubestack.yaml
          - values-plantain-build.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        maxDuration: 5m
