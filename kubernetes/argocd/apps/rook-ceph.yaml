# rook operator (+ ceph-csi-operator subchart) and the ceph crds
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/jiechenmc/kubestack.git
    targetRevision: main
    path: kubernetes/helm/rook-ceph
    helm:
      releaseName: rook-ceph
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    automated:
      # never prune here: the chart owns the ceph crds, deleting them deletes the cluster
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # rook crds exceed the client-side last-applied annotation limit
    retry:
      limit: 10
      backoff:
        duration: 10s
        maxDuration: 5m
