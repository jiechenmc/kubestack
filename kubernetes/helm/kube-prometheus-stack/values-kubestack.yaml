# kubestack overrides for kube-prometheus-stack (chart defaults stay in values.yaml)

# pick up ServiceMonitors/PodMonitors/PrometheusRules from every release (cilium, rook, cnpg),
# not only ones labelled for this chart
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    # cortex only accepts legacy [a-zA-Z_:][a-zA-Z0-9_:]* names and rejects the whole remote-write batch
    # otherwise; scrape dotted otel names (otelcol.k8s.pod.association) as underscores instead
    nameValidationScheme: Legacy
    nameEscapingScheme: Underscores
    # accept tempo's metrics-generator output (service graphs, span metrics)
    enableRemoteWriteReceiver: true
    # short local window; cortex keeps 30 days (remoteWrite below)
    retention: 2d
    # long-term copy of every sample in cortex (argo cd app cortex)
    remoteWrite:
      - url: http://cortex-nginx.cortex.svc/api/v1/push
        queueConfig:
          # back off and resend on cortex 429s instead of dropping the samples
          retryOnRateLimit: true
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - prometheus.home.arpa
    paths:
      - /
    pathType: Prefix

alertmanager:
  alertmanagerSpec:
    # links in notifications point here instead of the pod name
    externalUrl: http://alertmanager.home.arpa
    # discord webhook from infisical (InfisicalSecret alertmanager-discord in kubernetes/manifests/infisical.yaml),
    # mounted at /etc/alertmanager/secrets/alertmanager-discord/
    secrets:
      - alertmanager-discord
  # merged over the chart's config (inhibit rules, group_by etc. stay); receivers list is replaced whole
  config:
    route:
      receiver: discord
      routes:
        # always-firing heartbeat and the info-inhibitor helper: not for humans
        - receiver: 'null'
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
    receivers:
      - name: 'null'
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            send_resolved: true
            # one line per alert (its description) instead of the default label/annotation dump
            title: >-
              {{ if eq .Status "firing" }}🔥 {{ or .CommonLabels.alertname (printf "%d alerts" (len .Alerts.Firing)) }}{{ else }}✅ Resolved{{ end }}
            message: |-
              {{ range .Alerts.Firing }}• {{ or .Annotations.description .Annotations.summary .Labels.alertname }}
              {{ end }}{{ range .Alerts.Resolved }}✅ {{ .Labels.alertname }}{{ with .Labels.namespace }} · {{ . }}{{ end }}{{ with .Labels.persistentvolumeclaim }}/{{ . }}{{ end }}{{ with .Labels.pod }}/{{ . }}{{ end }} resolved
              {{ end }}
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - alertmanager.home.arpa
    paths:
      - /
    pathType: Prefix

# the chart's own KubePersistentVolumeFillingUp only fires at <3% free (or <15% free and predicted
# full within 4 days); warn earlier, at a flat 90% used
additionalPrometheusRulesMap:
  pvc-usage:
    groups:
      - name: pvc-usage
        rules:
          - alert: PersistentVolumeClaimUsageHigh
            # same exclusions as the chart rule: read-only volumes and pvcs labelled excluded_from_alerts=true
            expr: |-
              (
                kubelet_volume_stats_used_bytes{job="kubelet", metrics_path="/metrics"}
                  /
                kubelet_volume_stats_capacity_bytes{job="kubelet", metrics_path="/metrics"}
              ) > 0.90
              unless on (namespace, persistentvolumeclaim)
              kube_persistentvolumeclaim_access_mode{access_mode="ReadOnlyMany"} == 1
              unless on (namespace, persistentvolumeclaim)
              kube_persistentvolumeclaim_labels{label_excluded_from_alerts="true"} == 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: PersistentVolumeClaim is over 90% full.
              description: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full.

# kubeadm binds these to 127.0.0.1 and cilium replaces kube-proxy, so they'd only show as down
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

grafana:
  # the chart's ~25 kubernetes-mixin dashboards; replaced by the short list under dashboards below
  defaultDashboardsEnabled: false
  # helm test hooks; argo cd doesn't run helm tests
  testFramework:
    enabled: false
  # login from infisical (InfisicalSecret grafana-admin in kubernetes/manifests/infisical.yaml)
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # grafana 13 no longer bundles the loki datasource; install it from the plugin catalog at startup
  plugins:
    - loki
  # keep grafana.db (users, ui-edited dashboards, preferences) and installed plugins across restarts
  persistence:
    enabled: true
    size: 5Gi
  # rwo volume: the old pod must release it before the new one starts
  deploymentStrategy:
    type: Recreate
  # cortex (30 days) is the default; the chart's own Prometheus datasource (2 days local) stays available
  sidecar:
    datasources:
      isDefaultDatasource: false
  additionalDataSources:
    - name: Cortex
      uid: cortex
      type: prometheus
      url: http://cortex-nginx.cortex.svc/prometheus
      access: proxy
      isDefault: true
    - name: Tempo
      uid: tempo
      type: tempo
      url: http://tempo.tracing.svc:3200
      access: proxy
      jsonData:
        serviceMap:
          datasourceUid: prometheus
        tracesToMetrics:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: -5m
          spanEndTimeShift: 5m
          filterByTraceID: true
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.logging.svc:3100
      access: proxy
      jsonData:
        # otlp logs carry trace_id as structured metadata; link it to tempo
        derivedFields:
          - name: TraceID
            matcherType: label
            matcherRegex: trace_id
            datasourceUid: tempo
            url: "$${__value.raw}"
  service:
    type: LoadBalancer
    annotations:
      lbipam.cilium.io/ips: "10.144.138.203"
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.home.arpa
    path: /
  # the only dashboards provisioned (plus CloudNativePG from the cnpg chart); all from grafana.com.
  # anything else: explore, logs drilldown, hubble ui (hubble.home.arpa), ceph dashboard (ceph.home.arpa)
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: kubernetes
          orgId: 1
          folder: Kubernetes
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/kubernetes
        - name: nodes
          orgId: 1
          folder: Nodes
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/nodes
        - name: storage
          orgId: 1
          folder: Storage
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/storage
  dashboards:
    kubernetes:
      # cluster-wide cpu/memory/network/storage, then drill down
      k8s-views-global:
        gnetId: 15757
        revision: 43
        datasource: Prometheus
      k8s-views-namespaces:
        gnetId: 15758
        revision: 46
        datasource: Prometheus
      k8s-views-nodes:
        gnetId: 15759
        revision: 40
        datasource: Prometheus
      k8s-views-pods:
        gnetId: 15760
        revision: 41
        datasource: Prometheus
    nodes:
      # host-level detail: disks, filesystems, network interfaces, temperatures
      node-exporter-full:
        gnetId: 1860
        revision: 45
        datasource: Prometheus
    storage:
      # health, capacity, iops and latency from the ceph mgr prometheus module
      ceph-cluster:
        gnetId: 2842
        revision: 18
        datasource: Prometheus
