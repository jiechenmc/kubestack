# kubestack overrides for kube-prometheus-stack (chart defaults stay in values.yaml)

# pick up ServiceMonitors/PodMonitors/PrometheusRules from every release (cilium, rook, cnpg),
# not only ones labelled for this chart
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    # cortex only accepts legacy [a-zA-Z_:][a-zA-Z0-9_:]* names and rejects the whole remote-write batch
    # otherwise; scrape dotted otel names (otelcol.k8s.pod.association) as underscores instead
    nameValidationScheme: Legacy
    nameEscapingScheme: Underscores
    # accept tempo's metrics-generator output (service graphs, span metrics)
    enableRemoteWriteReceiver: true
    # short local window; cortex keeps 30 days (remoteWrite below)
    retention: 2d
    # long-term copy of every sample in cortex (argo cd app cortex)
    remoteWrite:
      - url: http://cortex-nginx.cortex.svc/api/v1/push
        queueConfig:
          # back off and resend on cortex 429s instead of dropping the samples
          retryOnRateLimit: true
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - prometheus.home.arpa
    paths:
      - /
    pathType: Prefix

alertmanager:
  alertmanagerSpec:
    # links in notifications point here instead of the pod name
    externalUrl: http://alertmanager.home.arpa
    # discord webhook from infisical (InfisicalSecret alertmanager-discord in kubernetes/manifests/infisical.yaml),
    # mounted at /etc/alertmanager/secrets/alertmanager-discord/
    secrets:
      - alertmanager-discord
  # merged over the chart's config (inhibit rules, group_by etc. stay); receivers list is replaced whole
  config:
    route:
      receiver: discord
      routes:
        # always-firing heartbeat and the info-inhibitor helper: not for humans
        - receiver: 'null'
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
    receivers:
      - name: 'null'
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            send_resolved: true
            # one line per alert (its description) instead of the default label/annotation dump
            title: >-
              {{ if eq .Status "firing" }}🔥 {{ or .CommonLabels.alertname (printf "%d alerts" (len .Alerts.Firing)) }}{{ else }}✅ Resolved{{ end }}
            message: |-
              {{ range .Alerts.Firing }}• {{ or .Annotations.description .Annotations.summary .Labels.alertname }}
              {{ end }}{{ range .Alerts.Resolved }}✅ {{ .Labels.alertname }}{{ with .Labels.namespace }} · {{ . }}{{ end }}{{ with .Labels.persistentvolumeclaim }}/{{ . }}{{ end }}{{ with .Labels.pod }}/{{ . }}{{ end }} resolved
              {{ end }}
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - alertmanager.home.arpa
    paths:
      - /
    pathType: Prefix

# the chart's own KubePersistentVolumeFillingUp only fires at <3% free (or <15% free and predicted
# full within 4 days); warn earlier, at a flat 90% used
additionalPrometheusRulesMap:
  pvc-usage:
    groups:
      - name: pvc-usage
        rules:
          - alert: PersistentVolumeClaimUsageHigh
            # same exclusions as the chart rule: read-only volumes and pvcs labelled excluded_from_alerts=true
            expr: |-
              (
                kubelet_volume_stats_used_bytes{job="kubelet", metrics_path="/metrics"}
                  /
                kubelet_volume_stats_capacity_bytes{job="kubelet", metrics_path="/metrics"}
              ) > 0.90
              unless on (namespace, persistentvolumeclaim)
              kube_persistentvolumeclaim_access_mode{access_mode="ReadOnlyMany"} == 1
              unless on (namespace, persistentvolumeclaim)
              kube_persistentvolumeclaim_labels{label_excluded_from_alerts="true"} == 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: PersistentVolumeClaim is over 90% full.
              description: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full.
  # components the chart's default rules don't know about. warning/critical pairs share an alertname so
  # the chart's inhibit rule mutes the warning while the critical fires (one discord line, not two)
  homelab:
    groups:
      - name: ceph
        rules:
          # ceph_health_status honours the cluster's muteHealthWarning list (ceph_health_detail does not)
          - alert: CephHealthWarning
            expr: ceph_health_status == 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Ceph is HEALTH_WARN.
              description: Ceph cluster {{ $labels.cluster }} has been HEALTH_WARN for 15m; run `ceph health detail` in the rook-ceph-tools pod.
          - alert: CephHealthError
            expr: ceph_health_status == 2
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Ceph is HEALTH_ERR.
              description: Ceph cluster {{ $labels.cluster }} is HEALTH_ERR; volumes may be read-only. Run `ceph health detail` in the rook-ceph-tools pod.
          - alert: CephOSDDown
            expr: ceph_osd_up == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: A Ceph OSD is down.
              description: Ceph {{ $labels.ceph_daemon }} has been down for 5m.
          - alert: CephMonOutOfQuorum
            expr: ceph_mon_quorum_status == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: A Ceph monitor is out of quorum.
              description: Ceph {{ $labels.ceph_daemon }} has been out of quorum for 5m.
          # rbd volumes are thin-provisioned, so pvc sizes can add up to more than the raw capacity;
          # ceph itself goes HEALTH_WARN at 85% (nearfull) and read-only at 95% (full)
          - alert: CephClusterFillingUp
            expr: ceph_cluster_total_used_bytes / ceph_cluster_total_bytes > 0.75
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Ceph raw capacity is over 75% used.
              description: Ceph cluster {{ $labels.cluster }} raw capacity is {{ $value | humanizePercentage }} used.
          - alert: CephClusterFillingUp
            expr: ceph_cluster_total_used_bytes / ceph_cluster_total_bytes > 0.85
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Ceph raw capacity is over 85% used.
              description: Ceph cluster {{ $labels.cluster }} raw capacity is {{ $value | humanizePercentage }} used; writes stop at 95%.
      - name: cloudnative-pg
        rules:
          - alert: PostgresInstanceDown
            expr: cnpg_collector_up == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: A Postgres instance is down.
              description: Postgres {{ $labels.namespace }}/{{ $labels.pod }} (cluster {{ $labels.cluster }}) has been down for 5m.
          - alert: PostgresReplicaNotStreaming
            expr: cnpg_pg_replication_in_recovery == 1 and cnpg_pg_replication_is_wal_receiver_up == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: A Postgres replica is not streaming from the primary.
              description: Postgres replica {{ $labels.namespace }}/{{ $labels.pod }} has not been streaming wal from the primary for 5m.
          - alert: PostgresReplicationLag
            expr: cnpg_pg_replication_lag > 300
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: A Postgres replica is lagging.
              description: Postgres replica {{ $labels.namespace }}/{{ $labels.pod }} is {{ $value | humanizeDuration }} behind the primary.
          - alert: PostgresConnectionsHigh
            expr: |-
              sum by (namespace, pod, cluster) (cnpg_backends_total)
                / on (namespace, pod) group_left
              max by (namespace, pod) (cnpg_pg_settings_setting{name="max_connections"})
              > 0.8
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Postgres is near max_connections.
              description: Postgres {{ $labels.namespace }}/{{ $labels.pod }} is using {{ $value | humanizePercentage }} of max_connections.
      - name: argocd
        rules:
          # long windows: apps pass through OutOfSync/Progressing on every push
          - alert: ArgoCDAppOutOfSync
            expr: argocd_app_info{sync_status!="Synced"} == 1
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: An Argo CD app is out of sync.
              description: Argo CD app {{ $labels.name }} has been {{ $labels.sync_status }} for 30m.
          - alert: ArgoCDAppUnhealthy
            expr: argocd_app_info{health_status!~"Healthy|Progressing|Suspended"} == 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: An Argo CD app is unhealthy.
              description: Argo CD app {{ $labels.name }} has been {{ $labels.health_status }} for 15m.
      - name: cert-manager
        rules:
          - alert: CertificateNotReady
            expr: certmanager_certificate_ready_status{condition="False"} == 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: A cert-manager certificate is not ready.
              description: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} has not been ready for 15m.
          # cert-manager renews at 2/3 of the lifetime, so a week left means renewal has been failing
          - alert: CertificateExpiringSoon
            expr: certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 86400
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: A cert-manager certificate expires within a week.
              description: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}.
      - name: node-hardware
        rules:
          # coretemp (optiplex) reports high 94 / crit 100; the ryzen's k10temp throttles at 95 and reports neither
          - alert: NodeHighTemperature
            expr: |-
              max by (nodename, chip_name, sensor) (
                node_hwmon_temp_celsius
                * on (instance, chip) group_left (chip_name) node_hwmon_chip_names
                * on (instance) group_left (nodename) node_uname_info
              ) > 85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: A node is running hot.
              description: '{{ $labels.nodename }} {{ $labels.chip_name }} {{ $labels.sensor }} has been above 85°C for 10m (now {{ $value }}°C).'
          - alert: NodeHighTemperature
            expr: |-
              max by (nodename, chip_name, sensor) (
                node_hwmon_temp_celsius
                * on (instance, chip) group_left (chip_name) node_hwmon_chip_names
                * on (instance) group_left (nodename) node_uname_info
              ) > 95
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: A node is about to thermal-throttle.
              description: '{{ $labels.nodename }} {{ $labels.chip_name }} {{ $labels.sensor }} is at {{ $value }}°C (throttles around 95-100°C).'

# kubeadm binds these to 127.0.0.1 and cilium replaces kube-proxy, so they'd only show as down
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

kube-state-metrics:
  # kube_node_labels only exists for allowlisted labels. kubevirt's KubeVirtNoAvailableNodesToRunVMs
  # counts nodes labelled kubevirt.io/schedulable=true from it, so without this it always fires
  metricLabelsAllowlist:
    - nodes=[kubevirt.io/schedulable]

grafana:
  # the chart's ~25 kubernetes-mixin dashboards; replaced by the short list under dashboards below
  defaultDashboardsEnabled: false
  # helm test hooks; argo cd doesn't run helm tests
  testFramework:
    enabled: false
  # login from infisical (InfisicalSecret grafana-admin in kubernetes/manifests/infisical.yaml)
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # grafana 13 no longer bundles the loki datasource; install it from the plugin catalog at startup
  plugins:
    - loki
  # keep grafana.db (users, ui-edited dashboards, preferences) and installed plugins across restarts
  persistence:
    enabled: true
    size: 5Gi
  # rwo volume: the old pod must release it before the new one starts
  deploymentStrategy:
    type: Recreate
  # cortex (30 days) is the default; the chart's own Prometheus datasource (2 days local) stays available
  sidecar:
    datasources:
      isDefaultDatasource: false
    # dashboards from ConfigMaps labeled grafana_dashboard=1 (any namespace); the grafana_folder
    # annotation picks the folder (kubernetes/infrastructure/grafana: pod overview)
    dashboards:
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  additionalDataSources:
    - name: Cortex
      uid: cortex
      type: prometheus
      url: http://cortex-nginx.cortex.svc/prometheus
      access: proxy
      isDefault: true
    - name: Tempo
      uid: tempo
      type: tempo
      url: http://tempo.tracing.svc:3200
      access: proxy
      jsonData:
        serviceMap:
          datasourceUid: prometheus
        # the span's pod, one click away: cpu, memory, restarts of the pod (and namespace) it ran in,
        # from the k8s.* resource attributes the collector's k8sattributes processor adds
        tracesToMetrics:
          datasourceUid: cortex
          spanStartTimeShift: -15m
          spanEndTimeShift: 15m
          tags:
            - key: k8s.namespace.name
              value: namespace
            - key: k8s.pod.name
              value: pod
          queries:
            - name: Pod CPU (cores)
              query: sum by (pod) (rate(container_cpu_usage_seconds_total{$$__tags, container!=""}[2m]))
            - name: Pod memory (working set)
              query: sum by (pod) (container_memory_working_set_bytes{$$__tags, container!=""})
            - name: Pod restarts
              query: sum by (pod) (kube_pod_container_status_restarts_total{$$__tags})
        nodeGraph:
          enabled: true
        # cpu profile of the request: the sdk tags its samples with the root span's id
        # (pyroscope.profile.id on the span; trix api, see trix_api/profiling.py)
        tracesToProfiles:
          datasourceUid: pyroscope
          profileTypeId: process_cpu:cpu:nanoseconds:cpu:nanoseconds
          tags:
            - key: service.name
              value: service_name
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: -5m
          spanEndTimeShift: 5m
          filterByTraceID: true
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.logging.svc:3100
      access: proxy
      jsonData:
        # otlp logs carry trace_id as structured metadata; link it to tempo
        derivedFields:
          - name: TraceID
            matcherType: label
            matcherRegex: trace_id
            datasourceUid: tempo
            url: "$${__value.raw}"
          # every log line links to its pod's overview (stats + logs + traces together)
          - name: Pod overview
            matcherType: label
            matcherRegex: k8s_pod_name
            url: "/d/pod-overview/pod-overview?var-namespace=$$__all&var-pod=$${__value.raw}&$${__url_time_range}"
            urlDisplayLabel: Pod overview
    # continuous profiling (argo cd app pyroscope); profiles drilldown app in grafana's menu
    - name: Pyroscope
      uid: pyroscope
      type: grafana-pyroscope-datasource
      url: http://pyroscope.profiling.svc:4040
      access: proxy
  service:
    type: LoadBalancer
    annotations:
      lbipam.cilium.io/ips: "10.144.138.203"
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.home.arpa
    path: /
  # the only dashboards provisioned (plus CloudNativePG from the cnpg chart); from grafana.com, except
  # kubevirt's control-plane dashboard (github).
  # anything else: explore, logs drilldown, hubble ui (hubble.home.arpa), ceph dashboard (ceph.home.arpa)
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: kubernetes
          orgId: 1
          folder: Kubernetes
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/kubernetes
        - name: nodes
          orgId: 1
          folder: Nodes
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/nodes
        - name: storage
          orgId: 1
          folder: Storage
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/storage
        - name: virtualization
          orgId: 1
          folder: Virtualization
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/virtualization
  dashboards:
    kubernetes:
      # cluster-wide cpu/memory/network/storage, then drill down
      k8s-views-global:
        gnetId: 15757
        revision: 43
        datasource: Prometheus
      k8s-views-namespaces:
        gnetId: 15758
        revision: 46
        datasource: Prometheus
      k8s-views-nodes:
        gnetId: 15759
        revision: 40
        datasource: Prometheus
      k8s-views-pods:
        gnetId: 15760
        revision: 41
        datasource: Prometheus
    nodes:
      # host-level detail: disks, filesystems, network interfaces, temperatures
      node-exporter-full:
        gnetId: 1860
        revision: 45
        datasource: Prometheus
    storage:
      # health, capacity, iops and latency from the ceph mgr prometheus module
      ceph-cluster:
        gnetId: 2842
        revision: 18
        datasource: Prometheus
    virtualization:
      # per vm: cpu, memory, disk iops/latency, network (current kubevirt_vmi_* metric names)
      kubevirt-vm:
        gnetId: 25834
        revision: 1
        # import inputs: datasource uid, and the host cpu clock used to turn cpu seconds into mhz
        # (ryzen 5500u and i5-8500t both 2.1ghz base)
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus
          - name: VAR_DEFAULT_CPU_FREQUENCY_MEGA_HERTZ
            value: "2100"
      # kubevirt's own: virt-api/controller/handler request rates, workqueues, vmi phase transitions.
      # not on grafana.com, so pinned to a commit of github.com/kubevirt/monitoring
      kubevirt-control-plane:
        url: https://raw.githubusercontent.com/kubevirt/monitoring/c5980d56249dcbfa34ffa14024e0dd9b2c792ff7/dashboards/grafana/kubevirt-control-plane.json
