# kubestack overrides for the "otel-logs" release of opentelemetry-collector (daemonset)
# tails container logs on every node, adds k8s metadata and ships them to loki over otlp.
# the "otel-collector" release (values-kubestack.yaml) is the separate otlp gateway for traces.

mode: daemonset
fullnameOverride: otel-logs

image:
  repository: otel/opentelemetry-collector-k8s

presets:
  # filelog receiver on /var/log/pods (+ host mount); checkpoints keep read offsets across restarts
  logsCollection:
    enabled: true
    storeCheckpoints: true
  # pod, namespace, deployment, node on every log record
  kubernetesAttributes:
    enabled: true
  # per-node metrics, sent to clickstack only: pod/container cpu, memory, fs, network from the kubelet,
  # and the node's own cpu, memory, disk, network
  kubeletMetrics:
    enabled: true
  hostMetrics:
    enabled: true

# ingestion key for otlphttp/clickstack; optional, so the collector starts without it (clickstack
# then rejects, loki/tempo are unaffected). infisical restarts the pods when the secret changes
extraEnvs:
  - name: HYPERDX_INGESTION_KEY
    valueFrom:
      secretKeyRef:
        name: hyperdx-ingestion
        key: HYPERDX_INGESTION_KEY
        optional: true
annotations:
  secrets.infisical.com/auto-reload: "true"

config:
  receivers:
    # kubeadm kubelets serve a self-signed cert without the node ip in it; the preset's receiver
    # still authenticates with the serviceaccount token
    kubeletstats:
      insecure_skip_verify: true
    otlp: null
    jaeger: null
    zipkin: null
    prometheus: null # own metrics are scraped by the ServiceMonitor instead
    filelog:
      # replaces the preset's operator list, so its container parser is restated first
      operators:
        - type: container
          id: container-parser
          max_log_size: 102400
        # join continuation lines onto the entry they belong to (per log file, so containers never mix):
        # indented lines (stack traces, wrapped output), ceph-csi "#1: ..." error details, java "Caused by:".
        # without this each continuation is its own loki entry with no level ("unknown")
        - type: recombine
          id: recombine-continuations
          combine_field: body
          combine_with: "\n"
          source_identifier: attributes["log.file.path"]
          is_first_entry: 'body matches "^\\S" and not (body matches "^#\\d+: ") and not (body matches "^Caused by: ")'
          force_flush_period: 2s
          max_log_size: 102400
  processors:
    # terminal output that only makes sense on a console: colour/cursor escape codes, and the minecraft
    # console's ">...." prompt redraw glued to the front of lines. runs before the empty-line filter so
    # lines that were nothing but this are dropped
    transform/clean:
      error_mode: ignore
      log_statements:
        - context: log
          statements:
            - replace_pattern(body, "\\x1b\\[[0-9;?]*[A-Za-z]", "")
            - replace_pattern(body, "^>\\.{2,}", "")
    # blank lines (e.g. the infisical operator prints one between messages) carry nothing
    filter/empty:
      error_mode: ignore
      logs:
        log_record:
          - 'IsMatch(body, "^\\s*$")'
    # set severity on plain-text formats loki can't detect on its own (it already reads level= / "level":)
    transform/severity:
      error_mode: ignore
      log_statements:
        - context: log
          conditions:
            - severity_text == "" and not IsMatch(body, "(^|\\s)level=|\"level\"\\s*:")
          statements:
            # klog (kubernetes components, csi sidecars): I1010 05:25:11.217060 ...
            - set(severity_text, "INFO") where IsMatch(body, "^I\\d{4} ")
            - set(severity_text, "WARN") where IsMatch(body, "^W\\d{4} ")
            - set(severity_text, "ERROR") where IsMatch(body, "^E\\d{4} ")
            - set(severity_text, "FATAL") where IsMatch(body, "^F\\d{4} ")
            # ceph daemons: "debug <time> <thread> <prio> ..." (-1 derr, 0-4 info, 5+ debug)
            - set(severity_text, "ERROR") where severity_text == "" and IsMatch(body, "^debug \\S+ [0-9a-f]+ +-1 ")
            - set(severity_text, "INFO") where severity_text == "" and IsMatch(body, "^debug \\S+ [0-9a-f]+ +[0-4] ")
            - set(severity_text, "DEBUG") where severity_text == "" and IsMatch(body, "^debug \\S+ [0-9a-f]+ +([5-9]|\\d{2}) ")
            # ceph cluster/audit log [DBG]/[INF]/[WRN]/[ERR] and nginx error log [warn]/[error]
            - set(severity_text, "DEBUG") where severity_text == "" and IsMatch(body, "\\[(DBG|debug)\\]")
            - set(severity_text, "INFO") where severity_text == "" and IsMatch(body, "\\[(INF|info|notice)\\]")
            - set(severity_text, "WARN") where severity_text == "" and IsMatch(body, "\\[(WRN|warn|warning)\\]")
            - set(severity_text, "ERROR") where severity_text == "" and IsMatch(body, "\\[(ERR|error|crit|alert|emerg)\\]")
            # http access logs (nginx combined, cortex gateway): 5xx error, 4xx warn, otherwise info
            - set(severity_text, "ERROR") where severity_text == "" and IsMatch(body, "^\\S+ - \\S+ \\[[^\\]]+\\] +(\"[^\"]*\" )?5\\d\\d ")
            - set(severity_text, "WARN") where severity_text == "" and IsMatch(body, "^\\S+ - \\S+ \\[[^\\]]+\\] +(\"[^\"]*\" )?4\\d\\d ")
            - set(severity_text, "INFO") where severity_text == "" and IsMatch(body, "^\\S+ - \\S+ \\[[^\\]]+\\] ")
            # log4j "[hh:mm:ss] [thread/LEVEL] ..." (minecraft server and mods)
            - set(severity_text, "DEBUG") where severity_text == "" and IsMatch(body, "^\\[[0-9:]+\\] \\[[^\\]]*/(DEBUG|TRACE)\\]")
            - set(severity_text, "INFO") where severity_text == "" and IsMatch(body, "^\\[[0-9:]+\\] \\[[^\\]]*/INFO\\]")
            - set(severity_text, "WARN") where severity_text == "" and IsMatch(body, "^\\[[0-9:]+\\] \\[[^\\]]*/WARN\\]")
            - set(severity_text, "ERROR") where severity_text == "" and IsMatch(body, "^\\[[0-9:]+\\] \\[[^\\]]*/ERROR\\]")
            - set(severity_text, "FATAL") where severity_text == "" and IsMatch(body, "^\\[[0-9:]+\\] \\[[^\\]]*/FATAL\\]")
            # python logging "%(asctime)s %(levelname)s %(name)s ..." (trix api, uvicorn). must come
            # before the wording guess: uvicorn logs everything to a logger named "uvicorn.error"
            - set(severity_text, "DEBUG") where severity_text == "" and IsMatch(body, "^\\d{4}-\\d\\d-\\d\\d [\\d:,.]+ DEBUG ")
            - set(severity_text, "INFO") where severity_text == "" and IsMatch(body, "^\\d{4}-\\d\\d-\\d\\d [\\d:,.]+ INFO ")
            - set(severity_text, "WARN") where severity_text == "" and IsMatch(body, "^\\d{4}-\\d\\d-\\d\\d [\\d:,.]+ WARNING ")
            - set(severity_text, "ERROR") where severity_text == "" and IsMatch(body, "^\\d{4}-\\d\\d-\\d\\d [\\d:,.]+ ERROR ")
            - set(severity_text, "FATAL") where severity_text == "" and IsMatch(body, "^\\d{4}-\\d\\d-\\d\\d [\\d:,.]+ CRITICAL ")
            # anything still without a level: guess from wording, otherwise info (never "unknown")
            - set(severity_text, "ERROR") where severity_text == "" and IsMatch(body, "(?i)\\b(error|errors|err|fail|failed|failure|fatal|panic|exception)\\b")
            - set(severity_text, "WARN") where severity_text == "" and IsMatch(body, "(?i)\\b(warn|warning|deprecated)\\b")
            - set(severity_text, "INFO") where severity_text == ""
            # matching severity_number so any otlp consumer sees the same level
            - set(severity_number, SEVERITY_NUMBER_DEBUG) where severity_text == "DEBUG"
            - set(severity_number, SEVERITY_NUMBER_INFO) where severity_text == "INFO"
            - set(severity_number, SEVERITY_NUMBER_WARN) where severity_text == "WARN"
            - set(severity_number, SEVERITY_NUMBER_ERROR) where severity_text == "ERROR"
            - set(severity_number, SEVERITY_NUMBER_FATAL) where severity_text == "FATAL"
  exporters:
    debug: null
    otlphttp/loki:
      endpoint: http://loki.logging.svc:3100/otlp
    # side-by-side copy for clickstack (hyperdx.home.arpa). own queue and retries, so clickstack being
    # down or rejecting never holds up loki; a full queue drops instead of growing. the ingestion key
    # (hyperdx team settings -> infisical HYPERDX_INGESTION_KEY) arrives via the hyperdx-ingestion secret
    otlphttp/clickstack:
      endpoint: http://clickstack-otel-collector.clickstack.svc:4318
      headers:
        authorization: ${env:HYPERDX_INGESTION_KEY}
      sending_queue:
        queue_size: 1000
      retry_on_failure:
        max_elapsed_time: 60s
  service:
    pipelines:
      traces: null
      # node and pod metrics for clickstack only (grafana has prometheus/cortex)
      metrics:
        receivers: [] # kubeletstats and hostmetrics are added by their presets
        processors: [memory_limiter, batch]
        exporters: [otlphttp/clickstack]
      logs:
        receivers: [] # filelog is added by the logsCollection preset
        processors: [memory_limiter, transform/clean, filter/empty, transform/severity, batch]
        exporters: [otlphttp/loki, otlphttp/clickstack]

ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: false
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true

# daemonset mode has no service, so scrape the pods directly
podMonitor:
  enabled: true
