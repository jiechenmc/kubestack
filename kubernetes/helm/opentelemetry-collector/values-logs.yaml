# kubestack overrides for the "otel-logs" release of opentelemetry-collector (daemonset)
# tails container logs on every node, adds k8s metadata and ships them to loki over otlp.
# the "otel-collector" release (values-kubestack.yaml) is the separate otlp gateway for traces.

mode: daemonset
fullnameOverride: otel-logs

image:
  repository: otel/opentelemetry-collector-k8s

presets:
  # filelog receiver on /var/log/pods (+ host mount); checkpoints keep read offsets across restarts
  logsCollection:
    enabled: true
    storeCheckpoints: true
  # pod, namespace, deployment, node on every log record
  kubernetesAttributes:
    enabled: true

config:
  receivers:
    otlp: null
    jaeger: null
    zipkin: null
    prometheus: null # own metrics are scraped by the ServiceMonitor instead
  processors:
    # set severity on plain-text formats loki can't detect on its own (it already reads level= / "level":)
    transform/severity:
      error_mode: ignore
      log_statements:
        - context: log
          conditions:
            - severity_text == "" and not IsMatch(body, "(^|\\s)level=|\"level\"\\s*:")
          statements:
            # klog (kubernetes components, csi sidecars): I1010 05:25:11.217060 ...
            - set(severity_text, "INFO") where IsMatch(body, "^I\\d{4} ")
            - set(severity_text, "WARN") where IsMatch(body, "^W\\d{4} ")
            - set(severity_text, "ERROR") where IsMatch(body, "^E\\d{4} ")
            - set(severity_text, "FATAL") where IsMatch(body, "^F\\d{4} ")
            # ceph daemons: "debug <time> <thread> <prio> ..." (-1 derr, 0-4 info, 5+ debug)
            - set(severity_text, "ERROR") where severity_text == "" and IsMatch(body, "^debug \\S+ [0-9a-f]+ +-1 ")
            - set(severity_text, "INFO") where severity_text == "" and IsMatch(body, "^debug \\S+ [0-9a-f]+ +[0-4] ")
            - set(severity_text, "DEBUG") where severity_text == "" and IsMatch(body, "^debug \\S+ [0-9a-f]+ +([5-9]|\\d{2}) ")
            # ceph cluster/audit log [DBG]/[INF]/[WRN]/[ERR] and nginx error log [warn]/[error]
            - set(severity_text, "DEBUG") where severity_text == "" and IsMatch(body, "\\[(DBG|debug)\\]")
            - set(severity_text, "INFO") where severity_text == "" and IsMatch(body, "\\[(INF|info|notice)\\]")
            - set(severity_text, "WARN") where severity_text == "" and IsMatch(body, "\\[(WRN|warn|warning)\\]")
            - set(severity_text, "ERROR") where severity_text == "" and IsMatch(body, "\\[(ERR|error|crit|alert|emerg)\\]")
            # http access logs (nginx combined, cortex gateway): 5xx error, 4xx warn, otherwise info
            - set(severity_text, "ERROR") where severity_text == "" and IsMatch(body, "^\\S+ - \\S+ \\[[^\\]]+\\] +(\"[^\"]*\" )?5\\d\\d ")
            - set(severity_text, "WARN") where severity_text == "" and IsMatch(body, "^\\S+ - \\S+ \\[[^\\]]+\\] +(\"[^\"]*\" )?4\\d\\d ")
            - set(severity_text, "INFO") where severity_text == "" and IsMatch(body, "^\\S+ - \\S+ \\[[^\\]]+\\] ")
            # matching severity_number so any otlp consumer sees the same level
            - set(severity_number, SEVERITY_NUMBER_DEBUG) where severity_text == "DEBUG"
            - set(severity_number, SEVERITY_NUMBER_INFO) where severity_text == "INFO"
            - set(severity_number, SEVERITY_NUMBER_WARN) where severity_text == "WARN"
            - set(severity_number, SEVERITY_NUMBER_ERROR) where severity_text == "ERROR"
            - set(severity_number, SEVERITY_NUMBER_FATAL) where severity_text == "FATAL"
  exporters:
    debug: null
    otlphttp/loki:
      endpoint: http://loki.logging.svc:3100/otlp
  service:
    pipelines:
      traces: null
      metrics: null
      logs:
        receivers: [] # filelog is added by the logsCollection preset
        processors: [memory_limiter, transform/severity, batch]
        exporters: [otlphttp/loki]

ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: false
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true

# daemonset mode has no service, so scrape the pods directly
podMonitor:
  enabled: true
