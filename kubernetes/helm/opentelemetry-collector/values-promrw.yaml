# kubestack overrides for the "otel-promrw" release of opentelemetry-collector (deployment)
# prometheus remote write 2.0 in, otlp out to clickstack: a copy of selected prometheus jobs (the
# keep-list is the remoteWrite entry in kube-prometheus-stack's values) for hyperdx. cortex keeps
# getting everything through prometheus' own remote write.
# the receiver (alpha) translates counters and gauges only; classic histograms and summaries are
# dropped (prometheus would have to store them as native histograms, which grafana/cortex don't use)

mode: deployment
fullnameOverride: otel-promrw

image:
  # prometheus_remote_write receiver is only in contrib
  repository: otel/opentelemetry-collector-contrib

# ingestion key for otlphttp/clickstack (infisical HYPERDX_INGESTION_KEY via the hyperdx-ingestion
# secret this namespace already has); infisical restarts the pod when it changes
extraEnvs:
  - name: HYPERDX_INGESTION_KEY
    valueFrom:
      secretKeyRef:
        name: hyperdx-ingestion
        key: HYPERDX_INGESTION_KEY
        optional: true
annotations:
  secrets.infisical.com/auto-reload: "true"

config:
  receivers:
    otlp: null
    jaeger: null
    zipkin: null
    prometheus: null # own metrics are scraped by the ServiceMonitor instead
    prometheus_remote_write:
      endpoint: 0.0.0.0:9090
      # one entry per job/instance pair (target_info attributes); comfortably above the keep-list
      resource_cache_size: 5000
  exporters:
    debug: null
    otlphttp/clickstack:
      endpoint: http://clickstack-otel-collector.clickstack.svc:4318
      headers:
        authorization: ${env:HYPERDX_INGESTION_KEY}
      sending_queue:
        queue_size: 1000
      retry_on_failure:
        max_elapsed_time: 60s
  service:
    pipelines:
      logs: null
      traces: null
      metrics:
        receivers: [prometheus_remote_write]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/clickstack]

ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: false
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  promrw:
    enabled: true
    containerPort: 9090
    servicePort: 9090
    protocol: TCP
  metrics:
    enabled: true

serviceMonitor:
  enabled: true
  metricsEndpoints:
    - port: metrics
