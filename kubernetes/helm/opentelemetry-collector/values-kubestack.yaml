# kubestack overrides for opentelemetry-collector (chart defaults stay in values.yaml)
# a single otlp gateway: apps send traces here, they get k8s metadata and go to tempo

mode: deployment
fullnameOverride: otel-collector

image:
  # curated kubernetes distribution (otlp, k8sattributes, kubeletstats, filelog, ...)
  repository: otel/opentelemetry-collector-k8s

presets:
  # adds the k8sattributes processor (pod, namespace, deployment on every span) and its rbac
  kubernetesAttributes:
    enabled: true


config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null # own metrics are scraped by the ServiceMonitor instead
  processors:
    # python asgi/fastapi instrumentation adds an internal span per message sent/received
    # ("GET /x http send"); always leaf children of the request span, so dropping them loses nothing.
    # (an app's own setup could pass exclude_spans; the operator-injected agent has no env for it)
    filter/asgi-messages:
      error_mode: ignore
      traces:
        span:
          - 'kind == SPAN_KIND_INTERNAL and IsMatch(name, " http (send|receive)$")'
  exporters:
    debug: null
    otlp/tempo:
      endpoint: tempo.tracing.svc:4317
      tls:
        insecure: true
  service:
    pipelines:
      logs: null
      metrics: null
      traces:
        receivers: [otlp]
        processors: [memory_limiter, filter/asgi-messages, batch]
        exporters: [otlp/tempo]

ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true

serviceMonitor:
  enabled: true
