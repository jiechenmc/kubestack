# kubestack overrides for opentelemetry-collector (chart defaults stay in values.yaml)
# a single otlp gateway: apps send traces here, they get k8s metadata and go to tempo

mode: deployment
fullnameOverride: otel-collector

image:
  # curated kubernetes distribution (otlp, k8sattributes, kubeletstats, filelog, ...)
  repository: otel/opentelemetry-collector-k8s

presets:
  # adds the k8sattributes processor (pod, namespace, deployment on every span) and its rbac
  kubernetesAttributes:
    enabled: true

# ingestion key for otlphttp/clickstack; optional, so the collector starts without it (clickstack
# then rejects, loki/tempo are unaffected). infisical restarts the pods when the secret changes
extraEnvs:
  - name: HYPERDX_INGESTION_KEY
    valueFrom:
      secretKeyRef:
        name: hyperdx-ingestion
        key: HYPERDX_INGESTION_KEY
        optional: true
annotations:
  secrets.infisical.com/auto-reload: "true"

config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null # own metrics are scraped by the ServiceMonitor instead
  processors:
    # python asgi/fastapi instrumentation adds an internal span per message sent/received
    # ("GET /x http send"); always leaf children of the request span, so dropping them loses nothing.
    # (an app's own setup could pass exclude_spans; the operator-injected agent has no env for it)
    filter/asgi-messages:
      error_mode: ignore
      traces:
        span:
          - 'kind == SPAN_KIND_INTERNAL and IsMatch(name, " http (send|receive)$")'
  exporters:
    debug: null
    otlp/tempo:
      endpoint: tempo.tracing.svc:4317
      tls:
        insecure: true
    # side-by-side copy for clickstack (hyperdx.home.arpa). own queue and retries, so clickstack being
    # down or rejecting never holds up tempo; a full queue drops instead of growing. the ingestion key
    # (hyperdx team settings -> infisical HYPERDX_INGESTION_KEY) arrives via the hyperdx-ingestion secret
    otlphttp/clickstack:
      endpoint: http://clickstack-otel-collector.clickstack.svc:4318
      headers:
        authorization: ${env:HYPERDX_INGESTION_KEY}
      sending_queue:
        queue_size: 1000
      retry_on_failure:
        max_elapsed_time: 60s
  service:
    pipelines:
      logs: null
      metrics: null
      traces:
        receivers: [otlp]
        processors: [memory_limiter, filter/asgi-messages, batch]
        exporters: [otlp/tempo, otlphttp/clickstack]

ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true

serviceMonitor:
  enabled: true
