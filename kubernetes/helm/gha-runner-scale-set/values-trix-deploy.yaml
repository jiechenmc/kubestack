# Runner scale set "trix-deploy": runs only jiechenmc/trix's production deploy
# job (`runs-on: trix-deploy`). Separate from trix-cluster so preview jobs
# never carry production permissions. Installed by the github_runners salt
# state; permissions in kubernetes/manifests/github-runners.yaml.
#
# Repo-level runners can't be limited to the main branch, so anyone who can
# push a branch to the repo could target these -- hence the narrow role.
githubConfigUrl: https://github.com/jiechenmc/trix
githubConfigSecret: trix-runner-github

runnerScaleSetName: trix-deploy
minRunners: 0
maxRunners: 1

template:
  spec:
    serviceAccountName: trix-prod-deployer
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        env:
          # kubectl from the image volume below, ahead of the runner image's default PATH
          - name: PATH
            value: /opt/kubectl/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        volumeMounts:
          - { name: kubectl, mountPath: /opt/kubectl, readOnly: true }
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { memory: 1Gi }
    volumes:
      # the official kubectl image mounted read-only (kubernetes image volumes); pulled once per node,
      # so workflows don't install kubectl. keep the tag in step with the cluster version.
      - name: kubectl
        image:
          reference: registry.k8s.io/kubectl:v1.36.5
          pullPolicy: IfNotPresent
