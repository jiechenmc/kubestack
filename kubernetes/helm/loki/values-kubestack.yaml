# kubestack overrides for loki (chart defaults stay in values.yaml)
# chart: grafana-community/loki, monolithic (single binary)
# chunks + index in the ceph rgw bucket from the "loki-bucket" ObjectBucketClaim (salt state logging)

deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2025-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki
      admin: loki
    s3:
      endpoint: rook-ceph-rgw-objectstore.rook-ceph.svc:80
      insecure: true
      s3ForcePathStyle: true
      # expanded from the bucket claim's secret (singleBinary.extraEnv); the chart passes -config.expand-env
      accessKeyId: ${AWS_ACCESS_KEY_ID}
      secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
  limits_config:
    retention_period: 336h # 14 days, enforced by the compactor
    allow_structured_metadata: true # needed for otlp ingestion (trace_id etc.)
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: s3

singleBinary:
  replicas: 1
  extraEnv:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef: { name: loki-bucket, key: AWS_ACCESS_KEY_ID }
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef: { name: loki-bucket, key: AWS_SECRET_ACCESS_KEY }
  # wal + index cache + compactor working dir
  persistence:
    enabled: true
    size: 10Gi

# the chart also defaults the simple-scalable targets to 3 replicas each
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# single node: no nginx gateway, memcached caches, canary or helm test pods
gateway:
  enabled: false
resultsCache:
  enabled: false
chunksCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true
  dashboards:
    enabled: true
