# kubestack overrides for argo-cd (chart defaults stay in values.yaml)
# salt installs this release (state argocd) and the root app; argo cd then syncs kubernetes/argocd/apps

global:
  domain: argocd.home.arpa

configs:
  cm:
    # track resources by annotation, not the app.kubernetes.io/instance label the helm charts already set
    application.resourceTrackingMethod: annotation
    # argo cd 2.x+ dropped Application health; restore it so sync waves in the root app wait for each
    # child app to be healthy (rook operator -> csi drivers -> ceph cluster)
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
    # operators (cnpg, rook, ...) inject their own ca into webhooks and crd conversion at runtime;
    # without these the apps show OutOfSync forever
    resource.customizations.ignoreDifferences.admissionregistration.k8s.io_MutatingWebhookConfiguration: |
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
    resource.customizations.ignoreDifferences.admissionregistration.k8s.io_ValidatingWebhookConfiguration: |
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
    resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
      jqPathExpressions:
        - '.spec.conversion.webhook.clientConfig.caBundle'
  params:
    # tls terminates at traefik (*.home.arpa), the server serves plain http behind it
    server.insecure: true

dex:
  enabled: false

server:
  ingress:
    enabled: true
    ingressClassName: traefik
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

applicationSet:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
