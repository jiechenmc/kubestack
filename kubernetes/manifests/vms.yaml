# kubevirt vms. root disks clone vm-images/rocky-10 (packer/rocky10), cloud-init adds the ssh keys;
# log in as rocky. ssh rocky@10.144.138.211 from the lan, or virtctl ssh -n vms rocky@vm/rocky-1
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: rocky-1
  namespace: vms
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: rocky-1-root
      spec:
        source:
          pvc:
            namespace: vm-images
            name: rocky-10
        storage:
          storageClassName: rook-ceph-block
          accessModes: [ReadWriteOnce]
          volumeMode: Block
          resources:
            requests:
              storage: 20Gi
  template:
    spec:
      domain:
        cpu:
          cores: 2
        memory:
          guest: 4Gi
        devices:
          disks:
            - name: root
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: root
          dataVolume:
            name: rocky-1-root
        - name: cloudinit
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: rocky-1
              ssh_authorized_keys:
                - ssh-rsa  chenj7728@MacBook-Air.lan
                - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIUuPjQm6PMxW7KZftSnpAbRPYTOLV8FuUlO9OThLlDR chenj7728@DESKTOP-LKJ3I25
                - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIII5F3XkpAZ4CYZSBRN7o/W1KfGiuP8RJ3kKYSjDK0He root@localhost.localdomain
---
# ssh from the lan on a fixed address (cilium lb pool 10.144.138.200-220)
apiVersion: v1
kind: Service
metadata:
  name: rocky-1-ssh
  namespace: vms
  annotations:
    lbipam.cilium.io/ips: "10.144.138.211"
spec:
  type: LoadBalancer
  selector:
    vm.kubevirt.io/name: rocky-1
  ports:
    - name: ssh
      port: 22
      targetPort: 22
