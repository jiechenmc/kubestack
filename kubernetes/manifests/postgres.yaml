apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
spec:
  # single node: one instance; raise to 3 (primary + 2 replicas) once there are more nodes
  instances: 3
  storage:
    storageClass: rook-ceph-block
    size: 5Gi
  bootstrap:
    initdb:
      database: app
      owner: app
---
# scraped by kube-prometheus-stack; cnpg instances expose metrics on the "metrics" port (9187)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pg
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: pg
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
