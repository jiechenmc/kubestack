apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false # never deleted by argo cd
spec:
  # primary + 2 replicas
  instances: 3
  postgresql:
    parameters:
      # setting any pg_stat_statements.* parameter makes cnpg preload the library and create the
      # extension in every database. per-query totals: SELECT * FROM pg_stat_statements
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: top
    # a commit returns only once at least one replica has the wal on disk (synchronous_commit=on),
    # so losing the primary can't lose acknowledged writes. "required": with no replica reachable,
    # writes wait instead of quietly going async; switch to "preferred" if uptime matters more
    synchronous:
      method: any
      number: 1
      dataDurability: required
  storage:
    storageClass: rook-ceph-block
    size: 5Gi
  bootstrap:
    initdb:
      database: app
      owner: app
---
# scraped by kube-prometheus-stack; cnpg instances expose metrics on the "metrics" port (9187)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pg
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: pg
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
---
# postgres from the lan: pg.home.arpa:5432 -> traefik "postgres" entrypoint -> primary (pg-rw).
# plain tcp can't be routed by hostname, so HostSNI(`*`): one cluster per entrypoint port.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: pg
spec:
  entryPoints:
    - postgres
  routes:
    - match: HostSNI(`*`)
      services:
        - name: pg-rw
          port: 5432
