apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mc-data
  namespace: default
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate # never two servers on the same world volume
  selector:
    matchLabels:
      app: mc
  template:
    metadata:
      labels:
        app: mc
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120 # time to save the world on shutdown
      containers:
        - name: mc
          image: itzg/minecraft-server:latest
          tty: true
          stdin: true
          ports:
            - containerPort: 25565
              name: minecraft
          env:
            - name: TYPE
              value: AUTO_CURSEFORGE
            - name: CF_SLUG
              value: all-the-mods-10
            - name: EULA
              value: "TRUE"
            - name: MEMORY
              value: 8G
            - name: CF_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mc-secrets
                  key: CF_API_KEY
          resources:
            requests:
              memory: 16Gi
              cpu: "4"
            limits:
              memory: 16Gi
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            exec:
              command: ["mc-health"]
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 60 # up to ~10 min for first modpack download/boot
          readinessProbe:
            exec:
              command: ["mc-health"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["mc-health"]
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mc-data
---
apiVersion: v1
kind: Service
metadata:
  name: mc
  namespace: default
spec:
  type: LoadBalancer # or NodePort, see below
  selector:
    app: mc
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
